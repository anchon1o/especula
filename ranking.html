<style>
:root{--ink:#1E242B;--oro:#E0B44A;--oro2:#B07D0A;--teal:#24707F;--teal2:#D5EBEF;--crema:#FBF6EA;--linea:#D9CFB8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Jersey 10',ui-monospace,monospace;font-size:19px;color:var(--ink);background:var(--crema);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:none}
.cab{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(115deg,var(--oro) 0 50%,var(--teal) 50%);border-bottom:3px solid #000}
.cab h1{margin:0;font-size:22px;font-weight:400;color:#FFE08A;text-shadow:2px 0 #1C1400,-2px 0 #1C1400,0 2px #1C1400,0 -2px #1C1400,2px 2px #1C1400;line-height:1;flex:1;text-transform:uppercase;letter-spacing:.02em}
.cab a{color:#000;background:var(--crema);border:2px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,.4);text-decoration:none;padding:3px 8px;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:17px;flex:1 0 auto;border:2px solid #000;background:#fff;color:var(--ink);padding:4px 8px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#FFE08A}
.tabs.var button.on.e{background:var(--oro2);color:#fff}
.tabs.var button.on.f{background:var(--teal);color:#fff}
.lista{flex:1;overflow-y:auto;padding:6px 8px 8px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:30px 30px 1fr auto;align-items:center;gap:6px;padding:5px 6px;border-bottom:2px dashed var(--linea);background:#fff}
li:nth-child(odd){background:#FFFDF8}
li .pos{text-align:center;font-size:20px}
li.p1 .pos{color:var(--oro2)}li.p2 .pos{color:#7d8a96}li.p3 .pos{color:#a5652f}
li img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .v{font-size:20px;white-space:nowrap}
li .v small{font-size:14px;opacity:.7;margin-left:3px}
.vacio{text-align:center;padding:24px 12px;line-height:1.3}
.vacio img{width:48px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.vacio a,.pie a{color:var(--teal)}
.pie{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:15px;border-top:2px solid #000;background:#fff}
.carga{opacity:.6;text-align:center;padding:20px}
@media (max-width:400px){.tabs button{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:3px 4px;font-size:15px}#xogar2{display:none}}
@media (max-width:360px){body{font-size:17px}.cab h1{font-size:19px}.tabs button{font-size:15px;padding:3px 6px}li{grid-template-columns:24px 24px 1fr auto}}
</style>
